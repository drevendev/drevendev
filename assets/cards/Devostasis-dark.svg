<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 278" role="img" aria-labelledby="title desc">
<title id="title">Devostasis</title>
<desc id="desc">Vital signs for repositories, not mystery scores. Deterministic diagnostics that keep missing evidence unknown and explain what actually changed.</desc>
<metadata>Emoji artwork: Twemoji v14.0.2, CC BY 4.0; see docs/ASSET_CREDITS.md. Original layout and ECG pulse.</metadata>
<style>
:root { --paper:#F6F4EF; --ink:#24292F; --line:#B7C4B7; --sage:#52735A; --pulse:#52735A; --muted:#526050; }
@media(prefers-color-scheme:dark) {
:root { --paper:#161D24; --ink:#E9E6DD; --line:#3D4C43; --sage:#87A78C; --pulse:#87A78C; --muted:#B9C8BB; }
}
</style>
<rect x="1" y="1" width="398" height="276" rx="10" fill="var(--paper,#161D24)" stroke="var(--line)" stroke-width="1.5"/>
<path d="M2 20v238" stroke="#63866A" stroke-width="4" stroke-linecap="round"/>
