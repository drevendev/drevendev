<text x="22" y="26" font-size="10" letter-spacing="2" fill="var(--muted)">02 / OPEN SOURCE</text>
<text x="22" y="62" font-size="25" font-weight="700"><tspan x="22" dy="0">Devostasis</tspan></text>
<text x="22" y="106" font-size="20" font-weight="700"><tspan x="22" dy="0">Vital signs for repositories, not</tspan><tspan x="22" dy="25">mystery scores.</tspan></text>
<text x="22" y="174" font-size="19" font-weight="400"><tspan x="22" dy="0">Deterministic diagnostics that keep</tspan><tspan x="22" dy="24">missing evidence unknown and explain</tspan><tspan x="22" dy="24">what actually changed.</tspan></text>
</g>
