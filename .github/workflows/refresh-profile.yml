name: Refresh public releases
on:
  schedule:
    - cron: '17 2,14 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: profile-public-releases
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Offline verification
        run: |
          python -m unittest discover -s tests -v
          python scripts/build_static.py --check
  commit:
    needs: verify
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Collect and refresh verified public releases
        run: python scripts/refresh_profile.py --live
      - name: Publish only a changed release block
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python scripts/publish_refresh.py

