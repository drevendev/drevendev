name: Profile checks
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: profile-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Offline tests and static configuration
        run: |
          python -m unittest discover -s tests -v
          python scripts/build_static.py --check
      - name: Offline fixture render
        run: python scripts/refresh_profile.py --fixture tests/fixtures/releases.json --dry-run

